name: Android pre-alpha
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64
      - name: Publish Android preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v0.5.0-prealpha.${GITHUB_RUN_NUMBER}"
          cp build/app/outputs/flutter-apk/app-release.apk Wallehog-Android.apk
          sha256sum Wallehog-Android.apk > SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          Android APK only / 仅支持 Android APK。

          Pre-alpha: manual savings records, wish progress, offline SQLite and pig feedback.
          早期预览：手工节省记录、心愿进度、本地 SQLite 和小猪反馈。

          Development-signed preview. CI signing keys are temporary: future builds may not support in-place upgrades. Export a backup before changing installations; do not uninstall an existing copy without a backup.
          开发签名预览版。CI 签名密钥不持久，后续构建可能无法覆盖安装；更换安装包前先导出备份，不要在未备份时卸载。

          Saved amounts are self-reported and are not real deposits or bank balances. Interface primarily Simplified Chinese.
          节省金额由用户自行记录，不代表真实存款或账户余额；界面目前以简体中文为主。
          NOTES
          gh release create "$tag" Wallehog-Android.apk SHA256SUMS.txt --target "$GITHUB_SHA" --title "Wallehog $tag · Android Pre-alpha" --notes-file release-notes.md --prerelease
