// Separate package for language acceptance; preserves existing .uitest installs.
gradle.beforeProject { project ->
    if (project.path == ':app') {
        project.plugins.withId('com.android.application') {
            project.extensions.getByName('androidComponents').finalizeDsl { android ->
                android.defaultConfig.applicationIdSuffix = '.languageuitest'
            }
        }
    }
}
